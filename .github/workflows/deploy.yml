name: CI/CD (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cicd-main
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: API Typecheck
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: API Tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://localhost:5432/test"
          REDIS_URL: "redis://localhost:6379"
          BETTER_AUTH_URL: "https://test.com"
          BETTER_AUTH_SECRET: "placeholder-secret-at-least-32-chars-long!!"
        run: pnpm test

      - name: Web Typecheck & Build
        working-directory: apps/web
        run: pnpm run build

  migrate:
    name: Database Migration (Neon)
    needs: test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Apply Drizzle Schema
        if: env.DATABASE_URL != ''
        working-directory: apps/api
        run: pnpm exec drizzle-kit push --force

  deploy:
    name: Deploy ${{ matrix.name }}
    needs:
      - test
      - migrate

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
            build: ""

          - name: web
            dir: apps/web
            build: pnpm run build

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api-hris.randikaa.my.id' }}
      PUBLIC_API_URL: https://api-hris.randikaa.my.id
      PUBLIC_SITE_URL: https://hris.randikaa.my.id

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build
        if: matrix.build != ''
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.build }}

      - name: Deploy
        working-directory: ${{ matrix.dir }}
        run: pnpm exec wrangler deploy --keep-vars
