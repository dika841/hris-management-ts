name: Deploy

on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy-web:
    name: Deploy Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=hris-management-web ${{ github.event.inputs.environment == 'production' && '--branch=main' || '' }}

  notify:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [build-and-deploy-web]
    if: always()
    steps:
      - name: Result
        env:
          WEB_RESULT: ${{ needs.build-and-deploy-web.result }}
        run: |
          echo "Web deployment: $WEB_RESULT"
          if [[ "$WEB_RESULT" == "failure" ]]; then
            echo "::error::Deployment failed"
            exit 1
          fi
