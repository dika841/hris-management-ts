name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
            build: ""

          - name: web
            dir: apps/web
            build: pnpm exec vite build

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api-hris.randika.dev' }}
      PUBLIC_API_URL: https://api-hris.randika.dev
      PUBLIC_SITE_URL: https://hris.randika.dev

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - name: Build
        if: matrix.build != ""
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.build }}

      - name: Deploy
        working-directory: ${{ matrix.dir }}
        run: pnpm exec wrangler deploy
