<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hris-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="hris-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Pillar (Cyan to Blue) -->
    <linearGradient id="left-grad" x1="21" y1="11" x2="21" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Right Pillar (Indigo to Violet) -->
    <linearGradient id="right-grad" x1="43" y1="11" x2="43" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Crossbar Bridge -->
    <linearGradient id="bridge-grad" x1="20" y1="36" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- AI Spark Gradient -->
    <linearGradient id="spark-grad" x1="32" y1="10" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="core-glow" cx="32" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#hris-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#hris-border)" stroke-width="1.5" />

  <!-- Core Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#core-glow)" />

  <!-- Connecting Bridge (Crossbar of H) -->
  <rect x="20" y="32" width="24" height="8" rx="4" fill="url(#bridge-grad)" />

  <!-- Left Figure / Pillar -->
  <circle cx="21" cy="16" r="5" fill="url(#left-grad)" />
  <rect x="16" y="24" width="10" height="26" rx="5" fill="url(#left-grad)" />

  <!-- Right Figure / Pillar -->
  <circle cx="43" cy="16" r="5" fill="url(#right-grad)" />
  <rect x="38" y="24" width="10" height="26" rx="5" fill="url(#right-grad)" />

  <!-- AI Intelligence Star / Spark -->
  <path d="M32 10 Q32 16 37 16 Q32 16 32 22 Q32 16 27 16 Q32 16 32 10 Z" fill="url(#spark-grad)" filter="url(#sparkle-glow)" />
</svg>
